name: Parse Forum Thread

on:
  workflow_dispatch:
    inputs:
      thread_url:
        description: 'URL ветки форума astronomy.ru'
        required: true
        type: string
      thread_name:
        description: 'Имя ветки (только для НОВЫХ; при обновлении оставь пустым)'
        required: false
        type: string
        default: ''

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4 lxml

      - name: Parse thread
        run: |
          python3 parse_thread.py "${{ inputs.thread_url }}" "${{ inputs.thread_name }}"

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add threads/
          if git diff --staged --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Update: ${{ inputs.thread_name || inputs.thread_url }}"
            git push
          fi
